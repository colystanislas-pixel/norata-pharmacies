const F={q:"",s:-1,z:-1};
let cur=null,view="list";

$("zf").innerHTML='<option value="-1">Toutes les zones</option>'+Z.map((z,i)=>`<option value="${i}">${esc(z)}</option>`).join("");
function drawChips(){
  $("chips").innerHTML=[["Tous",-1]].concat(ST.map((s,i)=>[s,i])).map(([l,i])=>`<button class="chip" data-s="${i}" aria-pressed="${F.s===i}">${l}</button>`).join("");
}
function drawList(){
  const q=F.q.toLowerCase().trim();
  const L=all().filter(p=>(F.z<0||p[1]===F.z)&&(F.s<0||(R(p[0]).s||0)===F.s)&&(!q||(p[2]+" "+p[3]+" "+Z[p[1]]).toLowerCase().includes(q)));
  $("cnt").textContent=L.length+" pharmacie"+(L.length>1?"s":"")+" sur "+all().length;
  $("list").innerHTML=L.map(p=>{const r=R(p[0]),s=r.s||0,a=amt(r);
    return `<article class="card" data-id="${p[0]}" style="--sc:var(--s${s})">
    <div class="top"><h3>${esc(p[2])}</h3><span class="badge">${ST[s]}</span></div>
    <p class="meta">${esc(Z[p[1]])}</p>
    <p class="meta ${/24h\/24/.test(p[4]||"")?"h24":""}">${esc(p[4]||"Horaires non renseignés")}</p>
    ${a?`<p class="cmd">Commande : ${fmt(a)} FCFA</p>`:""}
    ${r.ct?`<p class="meta">Contact : ${esc(r.ct)}</p>`:""}
    <div class="act">${p[3]?`<a class="btn p" href="tel:${tel(p[3])}">Appeler</a>`:""}<a class="btn" target="_blank" rel="noopener" href="${mapsUrl(p)}">Localiser</a><button class="btn" data-open="${p[0]}">Fiche</button></div>
  </article>`}).join("")||'<p class="count">Aucun résultat.</p>';
  $("sub").textContent="Norata · "+(all().length-all().filter(p=>(R(p[0]).s||0)===0).length)+" contactées sur "+all().length;
}
function drawSum(){
  const A=all(),n=A.length,c=ST.map((_,i)=>A.filter(p=>(R(p[0]).s||0)===i).length);
  const recs=A.map(p=>R(p[0])),qty=recs.reduce((a,r)=>a+(+r.q||0),0),tot=recs.reduce((a,r)=>a+amt(r),0);
  const ct=n-c[0],pc=n?Math.round(ct/n*100):0,tc=ct?Math.round(c[5]/ct*100):0;
  const zr=Z.map((z,i)=>{const P=A.filter(p=>p[1]===i);if(!P.length)return"";const rs=P.map(p=>R(p[0]));
    return `<tr><td>${esc(z)}</td><td>${P.length}</td><td>${rs.filter(r=>r.s>0).length}</td><td>${rs.filter(r=>r.s===5).length}</td><td>${rs.reduce((a,r)=>a+(+r.q||0),0)}</td><td>${fmt(rs.reduce((a,r)=>a+amt(r),0))}</td></tr>`}).join("");
  $("v-sum").innerHTML=`<div class="kpis">
  <div class="kpi w"><span>Montant total des commandes</span><b>${fmt(tot)} FCFA</b></div>
  <div class="kpi"><b>${n}</b><span>Pharmacies</span></div><div class="kpi"><b>${c[5]}</b><span>Commandes passées</span></div>
  <div class="kpi"><b>${pc} %</b><span>Déjà contactées</span></div><div class="kpi"><b>${tc} %</b><span>Commandes / contactées</span></div>
  <div class="kpi"><b>${qty}</b><span>Quantité commandée</span></div><div class="kpi"><b>${c[4]}</b><span>Rendez-vous pris</span></div></div>
  <h2>Par statut</h2>${ST.map((s,i)=>`<div class="bar" style="--sc:var(--s${i})"><span>${s}</span><div><i style="width:${n?c[i]/n*100:0}%"></i></div><em>${c[i]}</em></div>`).join("")}
  <h2>Par zone</h2><div class="tw"><table><tr><th>Zone</th><th>Pharm.</th><th>Contact.</th><th>Cmd</th><th>Qté</th><th>FCFA</th></tr>${zr}</table></div>
  <button class="btn cp" id="cpy">Copier le récapitulatif</button>`;
  $("cpy").onclick=async e=>{const t=`Suivi Norata – ${n} pharmacies\nContactées : ${ct} (${pc} %)\nRendez-vous : ${c[4]}\nCommandes : ${c[5]} (${tc} % des contactées)\nQuantité : ${qty}\nMontant : ${fmt(tot)} FCFA`;
    try{await navigator.clipboard.writeText(t);e.target.textContent="Copié ✓"}catch(x){e.target.textContent="Copie impossible"}};
}
function drawScript(){
  $("v-script").innerHTML='<p class="count">Remplacez les éléments <mark>[entre crochets]</mark> par vos informations.</p>'+SCR.map((r,i)=>`<details${i===0?" open":""}><summary>${esc(r[0])}</summary><p>${esc(r[1]).replace(/\[([^\]]+)\]/g,"<mark>[$1]</mark>")}</p></details>`).join("");
}
function drawHelp(){
  $("v-help").innerHTML=`
  <div class="note"><b>Sources et limites</b><br>Données Google Maps (numéros, horaires, positions) relevées le 02/10/2026 : confirmez à l’appel. La liste n’est pas exhaustive. Le numéro de la Pharmacie Elimane Aly Dramane (800 00 20 20) ressemble à un numéro vert : à vérifier.</div>
  <div class="note"><b>Vos données</b><br>Elles sont enregistrées sur cet appareil, dans ce navigateur. Les effacer ou changer de téléphone fait repartir de zéro : pensez à copier régulièrement le récapitulatif.<br>Le bouton ci-dessous remet tout à zéro : statuts, dates, contacts, commandes, notes et pharmacies ajoutées.</div><button class="btn del" id="wipe">Effacer toutes les données</button>`;
}
function sheet(id){
  const p=all().find(x=>x[0]===id);if(!p)return;cur=id;const r=R(id),cu=id>=1000;
  $("sh").innerHTML=`<button class="x" id="cl" aria-label="Fermer">✕</button>
  ${cu?`<label class="fl" style="margin-top:0">Nom de la pharmacie</label><input data-m="2" value="${esc(p[2])}" placeholder="Pharmacie…">
  <label class="fl">Zone</label><select data-m="1">${Z.map((z,i)=>`<option value="${i}"${i===p[1]?" selected":""}>${esc(z)}</option>`).join("")}</select>
  <label class="fl">Téléphone</label><input data-m="3" type="tel" value="${esc(p[3])}">`
  :`<h2>${esc(p[2])}</h2><p class="meta">${esc(Z[p[1]])} · ${esc(p[3])}<br>${esc(p[4]||"")}</p>`}
  <label class="fl">Statut</label><select data-f="s">${ST.map((s,i)=>`<option value="${i}"${i===(r.s||0)?" selected":""}>${s}</option>`).join("")}</select>
  <div class="g2"><div><label class="fl">Date d’appel</label><input type="date" data-f="da" value="${esc(r.da)}"></div><div><label class="fl">Date de visite</label><input type="date" data-f="dv" value="${esc(r.dv)}"></div></div>
  <label class="fl">Contact (pharmacien)</label><input data-f="ct" value="${esc(r.ct)}" placeholder="Dr …">
  <div class="g2"><div><label class="fl">Quantité</label><input type="number" inputmode="numeric" min="0" data-f="q" value="${esc(r.q)}"></div><div><label class="fl">Prix unitaire (FCFA)</label><input type="number" inputmode="numeric" min="0" data-f="pu" value="${esc(r.pu)}"></div></div>
  <div class="tot"><span>Commande</span><span id="tt">${fmt(amt(r))} FCFA</span></div>
  <label class="fl">Notes</label><textarea data-f="n" placeholder="Raison d’un refus, date de rappel…">${esc(r.n)}</textarea>
  <div class="act">${p[3]?`<a class="btn p" href="tel:${tel(p[3])}">Appeler</a>`:""}<a class="btn" target="_blank" rel="noopener" href="${mapsUrl(p)}">Localiser</a></div>
  ${cu?'<button class="btn del" id="dl">Supprimer cette pharmacie</button>':""}`;
  $("ov").classList.add("on");
  $("cl").onclick=close;
  if($("dl"))$("dl").onclick=()=>{if(confirm("Supprimer cette pharmacie ?")){S.custom=S.custom.filter(x=>x[0]!==id);delete S.rec[id];save();close(true)}};
}
function close(){
  if(cur>=1000){const p=S.custom.find(x=>x[0]===cur);if(p&&!p[2].trim()){S.custom=S.custom.filter(x=>x!==p);save()}}
  $("ov").classList.remove("on");cur=null;refresh();
}
const onEdit=e=>{
  const t=e.target,id=cur;if(id==null)return;
  if(t.dataset.m){const p=S.custom.find(x=>x[0]===id);p[+t.dataset.m]=t.dataset.m==="1"?+t.value:t.value;save();return}
  const f=t.dataset.f;if(!f)return;
  const r=S.rec[id]=S.rec[id]||{s:0};
  if(f==="s"){r.s=+t.value;if(r.s>0&&!r.da){r.da=new Date().toISOString().slice(0,10);const d=$("sh").querySelector('[data-f="da"]');if(d)d.value=r.da}}
  else r[f]=t.value;
  $("tt").textContent=fmt(amt(r))+" FCFA";save();drawList();
};
$("sh").addEventListener("input",onEdit);$("sh").addEventListener("change",onEdit);
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")close()});
$("list").addEventListener("click",e=>{
  if(e.target.closest("a"))return;
  const c=e.target.closest(".card");if(c)sheet(+c.dataset.id);
});
$("chips").addEventListener("click",e=>{const b=e.target.closest(".chip");if(!b)return;F.s=+b.dataset.s;drawChips();drawList()});
$("q").addEventListener("input",e=>{F.q=e.target.value;drawList()});
$("zf").addEventListener("change",e=>{F.z=+e.target.value;drawList()});
$("add").onclick=()=>{const id=1000+(S.custom.reduce((m,p)=>Math.max(m,p[0]-1000),0)+1);S.custom.push([id,0,"","","",null,null]);sheet(id)};
function refresh(){drawList();drawSum()}
const sync=()=>{if(cur!=null)return;try{const x=JSON.parse(localStorage.getItem("norata_v1")||"null");if(x){S.rec=x.rec||{};S.custom=x.custom||[]}}catch(e){}refresh()};
document.addEventListener("visibilitychange",()=>{if(!document.hidden)sync()});window.addEventListener("pageshow",sync);
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>{
  view=b.dataset.v;
  document.querySelectorAll(".view").forEach(v=>v.hidden=v.id!=="v-"+view);
  document.querySelectorAll("nav button").forEach(x=>x.removeAttribute("aria-current"));
  b.setAttribute("aria-current","page");
  $("tools").hidden=view!=="list";$("add").hidden=view!=="list";
  if(view==="sum")drawSum();window.scrollTo(0,0);
});
function drawGuide(){
  const b=i=>`<span class="badge" style="--sc:var(--s${i})">${ST[i]}</span>`;
  $("v-help").insertAdjacentHTML("afterbegin",`<p class="gh">Guide d’utilisation : touchez une rubrique pour la déplier.</p>
  <details open><summary>1. Installer l’application sur le téléphone</summary><ol>
  <li><b>iPhone</b> : ouvrez le lien dans Safari, touchez le bouton Partager, puis « Sur l’écran d’accueil ».</li>
  <li><b>Android</b> : ouvrez le lien dans Chrome, touchez le menu ⋮, puis « Ajouter à l’écran d’accueil ».</li>
  <li>Utilisez toujours le même navigateur : vos saisies sont enregistrées dedans.</li></ol></details>
  <details><summary>2. Trouver une pharmacie</summary><ul>
  <li>Onglet <b>Pharmacies</b> : tapez un nom, un quartier ou un bout de numéro dans la barre de recherche.</li>
  <li>Le menu « Toutes les zones » limite la liste à un quartier (Plateau, Almadies, Rufisque…).</li>
  <li>Les boutons de statut sous la recherche (Tous, À appeler, Intéressé…) filtrent selon l’avancement. Faites-les défiler vers la droite pour voir les autres.</li>
  <li>Le compteur au-dessus de la liste indique combien de pharmacies correspondent.</li></ul></details>
  <details><summary>3. Passer un appel et l’enregistrer</summary><ol>
  <li>Sur la carte de la pharmacie, touchez <b>Appeler</b> : le téléphone compose le numéro.</li>
  <li>Après l’appel, touchez la carte (ou <b>Fiche</b>) pour ouvrir la fiche.</li>
  <li>Choisissez le <b>statut</b>. La date d’appel se remplit toute seule avec celle du jour.</li>
  <li>Notez le <b>nom du pharmacien</b> (champ Contact) et, si besoin, une remarque dans <b>Notes</b> : motif du refus, jour de rappel convenu…</li>
  <li>Fermez la fiche avec ✕ ou en touchant à côté : tout est enregistré automatiquement.</li></ol></details>
  <details><summary>4. Que signifie chaque statut ?</summary><ul>
  <li>${b(0)} aucun contact pour l’instant.</li>
  <li>${b(1)} le téléphone a sonné sans réponse ou la ligne était occupée.</li>
  <li>${b(2)} le pharmacien a demandé de rappeler plus tard : notez le jour dans Notes.</li>
  <li>${b(3)} il veut en savoir plus mais n’a pas fixé de rendez-vous.</li>
  <li>${b(4)} une visite est prévue : renseignez la date de visite.</li>
  <li>${b(5)} la commande est confirmée : saisissez quantité et prix.</li>
  <li>${b(6)} la pharmacie ne souhaite pas le produit : notez la raison.</li></ul></details>
  <details><summary>5. Enregistrer une commande</summary><ol>
  <li>Ouvrez la fiche, choisissez le statut « Commande passée ».</li>
  <li>Saisissez la <b>quantité</b> et le <b>prix unitaire</b> en FCFA.</li>
  <li>Le montant se calcule seul. Exemple : 24 × 6 250 = 150 000 FCFA.</li>
  <li>Le montant apparaît ensuite sur la carte et dans le Résumé.</li></ol></details>
  <details><summary>6. Préparer ses visites</summary><ul>
  <li><b>Localiser</b> ouvre la position exacte de la pharmacie dans Google Maps, avec l’itinéraire.</li>
  <li>Filtrez par zone et par statut « Rendez-vous pris » pour regrouper les visites d’un même quartier.</li>
  <li>Vérifiez les horaires affichés avant de partir : ils datent du 02/10/2026.</li></ul></details>
  <details><summary>7. Lire le Résumé</summary><ul>
  <li><b>Montant total</b> : somme de toutes les commandes saisies.</li>
  <li><b>Déjà contactées</b> : part des pharmacies qui ne sont plus « À appeler ».</li>
  <li><b>Commandes / contactées</b> : combien de pharmacies contactées ont commandé.</li>
  <li>Le graphique par statut et le tableau par zone montrent où concentrer vos efforts.</li>
  <li><b>Copier le récapitulatif</b> prépare un texte à coller dans un message WhatsApp ou un mail.</li></ul></details>
  <details><summary>8. Utiliser le script d’appel</summary><ul>
  <li>L’onglet <b>Script</b> décrit chaque étape de l’appel, de l’accroche à la prise de commande.</li>
  <li>Les passages <mark>[entre crochets]</mark> sont à remplacer par le nom du produit, ses avantages, etc.</li>
  <li>Gardez-le ouvert pendant l’appel, puis revenez dans Pharmacies pour saisir le résultat.</li></ul></details>
  <details><summary>9. Ajouter ou supprimer une pharmacie</summary><ul>
  <li>Touchez le bouton <b>+</b> (en bas à droite de la liste), puis saisissez le nom, la zone et le téléphone.</li>
  <li>Une pharmacie ajoutée sans nom n’est pas conservée.</li>
  <li>Pour en supprimer une, ouvrez sa fiche et touchez « Supprimer cette pharmacie ». Seules les pharmacies que vous avez ajoutées peuvent être supprimées.</li></ul></details>`);
}
drawChips();drawList();drawScript();drawHelp();drawGuide();
let wt;$("wipe").onclick=e=>{const b=e.currentTarget;
  if(b.dataset.arm){S={rec:{},custom:[]};save();F.q="";F.s=-1;F.z=-1;$("q").value="";$("zf").value="-1";drawChips();refresh();clearTimeout(wt);b.dataset.arm="";b.textContent="Données effacées ✓";return}
  b.dataset.arm="1";b.textContent="Touchez encore pour tout effacer définitivement";clearTimeout(wt);
  wt=setTimeout(()=>{b.dataset.arm="";b.textContent="Effacer toutes les données"},5000)};
</script>
</body>
</html>
